services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: sous_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sous
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sous"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
